<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airports test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1420; color: #e8eef4; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #out { position: absolute; left: 12px; top: 12px; max-height: calc(100% - 24px); overflow: auto; margin: 0; padding: 10px 12px;
         background: rgba(6, 14, 24, 0.78); border: 1px solid #2a4258; border-radius: 6px; white-space: pre; }
  #status { position: absolute; right: 12px; top: 12px; padding: 8px 10px; background: rgba(6, 14, 24, 0.78); border: 1px solid #2a4258; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<pre id="out">loading…</pre>
<div id="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/world.js"></script>
<script>
// Inline stand-in for FS.world when js/world.js is absent: flat ground at each airport's elevation
// (blending to a 3 m basin floor), one 2048^2 ground canvas covering both airports, paintGround in world meters.
if (!window.FS.world) (function () {
  const FS = window.FS, CFG = FS.CONFIG;
  const rect = { x0: -34000, z0: -24000, x1: 8000, z1: 18000 };
  const size = 2048, pxPerM = size / (rect.x1 - rect.x0);
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#5e6a4c'; ctx.fillRect(0, 0, size, size);
  let tex = null;
  function getHeight(x, z) {
    let h = 3;
    for (const a of CFG.airports) {
      let best = Infinity;
      for (const r of a.runways) {
        const d = FS.geo.headingToDir(r.heading), rx = x - r.cx, rz = z - r.cz;
        const along = Math.abs(rx * d.x + rz * d.z), across = Math.abs(rx * -d.z + rz * d.x);
        const dist = Math.hypot(Math.max(0, along - r.length / 2), Math.max(0, across - r.width / 2));
        best = Math.min(best, dist);
      }
      const w = FS.geo.smoothstep(1800, 300, best);
      h = FS.geo.lerp(h, a.elev, w);
    }
    return h;
  }
  FS.world = {
    init(scene) {
      tex = FS.textureFromCanvas(canvas, { anisotropy: 4 });
      const geo = new THREE.PlaneGeometry(rect.x1 - rect.x0, rect.z1 - rect.z0, 220, 220);
      geo.rotateX(-Math.PI / 2);
      const cx = (rect.x0 + rect.x1) / 2, cz = (rect.z0 + rect.z1) / 2, pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setY(i, getHeight(pos.getX(i) + cx, pos.getZ(i) + cz));
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, color: FS.color('#ffffff'), roughness: 1 }));
      m.position.set(cx, 0, cz); m.receiveShadow = true; scene.add(m);
    },
    getHeight, isWater() { return false; },
    paintGround(fn) {
      ctx.save(); ctx.setTransform(pxPerM, 0, 0, pxPerM, -rect.x0 * pxPerM, -rect.z0 * pxPerM);
      fn(ctx, { rect, pxPerM, canvas, isInner: true });
      ctx.restore(); if (tex) tex.needsUpdate = true;
    },
    getGroundCanvases() { return [{ canvas, rect, pxPerM }]; },
    update() {}, setShadowFocus() {},
  };
})();
</script>
<script src="../js/airports.js"></script>
<script>
(function () {
  const FS = window.FS, out = document.getElementById('out'), status = document.getElementById('status');
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  FS.renderer = renderer;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#8fb8dc');
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.3, 150000);
  FS.scene = scene; FS.camera = camera;
  // sun from the SW (FS.CONFIG.sun), shadows focused on Songshan
  const sun = new THREE.DirectionalLight(FS.color('#fff1d6'), 2.2);
  const az = FS.CONFIG.sun.azimuthDeg * FS.geo.D2R, el = FS.CONFIG.sun.elevationDeg * FS.geo.D2R;
  sun.position.set(Math.sin(az) * Math.cos(el) * 4000, Math.sin(el) * 4000, -Math.cos(az) * Math.cos(el) * 4000);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -1600, right: 1600, top: 1600, bottom: -1600, near: 100, far: 12000 });
  scene.add(sun); scene.add(sun.target);
  scene.add(new THREE.HemisphereLight(FS.color('#cfe3ff'), FS.color('#6a7250'), 0.55));
  const t0 = performance.now();
  try { FS.world.init(scene, renderer); } catch (e) { console.error(e); }
  FS.airports.init(scene);
  const initMs = Math.round(performance.now() - t0);
  const end10 = FS.airports.getRunwayEnd('RCSS-10');
  sun.target.position.set(end10.center.x, end10.elev, end10.center.z); sun.position.add(sun.target.position);
  // camera 400 m above Songshan, 250 m short of the 10 threshold, looking down the runway toward the 28 end
  camera.position.set(end10.threshold.x - end10.dir.x * 250, end10.elev + 400, end10.threshold.z - end10.dir.z * 250);
  camera.lookAt(end10.oppositeThreshold.x, end10.elev, end10.oppositeThreshold.z);
  // fake aircraft state: 3 km final to runway 10 on a 3.0 deg slope -> PAPI should read WWRR
  const d = 3000, st = { pos: new THREE.Vector3(end10.threshold.x - end10.dir.x * d, end10.elev + d * Math.tan(3 * FS.geo.D2R), end10.threshold.z - end10.dir.z * d) };
  out.textContent = 'getRunwayEnd(\'RCSS-10\') =\n' + JSON.stringify(end10, null, 2);
  let last = performance.now();
  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
    FS.airports.update(dt, st);
    renderer.render(scene, camera);
    status.textContent = 'init ' + initMs + ' ms · draw calls ' + renderer.info.render.calls + ' · triangles ' + renderer.info.render.triangles +
      ' · PAPI RCSS-10 ' + end10.papiState + ' · onRunway(spawn) ' + (FS.airports.isOnRunway(end10.spawn.x, end10.spawn.z) ? end10.key : 'null') +
      ' · onPaved(tower) ' + FS.airports.isOnPaved(FS.airports.list[0].tower.x, FS.airports.list[0].tower.z);
  }
  window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });
  frame();
})();
</script>
</body>
</html>
